openapi: 3.0.3
info:
  title: OpenCode Server Model Discovery API
  version: 1.0.0
  description: OpenAI-compatible API for discovering available AI models

servers:
  - url: {baseUrl}
    description: Configurable OpenCode server instance

paths:
  /v1/models:
    get:
      summary: List available models
      description: Retrieve list of available AI models (OpenAI-compatible)
      operationId: listModels
      responses:
        '200':
          description: Successful response with list of models
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelDescriptor'
                    maxItems: 50
                    description: List of available models
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ModelDescriptor:
      type: object
      required:
        - id
        - object
        - created
        - owned_by
      properties:
        id:
          type: string
          description: Unique identifier for the model
          example: "llama3:latest"
        object:
          type: string
          enum: [model]
          description: Always "model"
        created:
          type: integer
          description: Unix timestamp
          example: 1640995200
        owned_by:
          type: string
          description: Organization or provider
          example: "ollama"

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message
          example: "Failed to retrieve models"