openapi: 3.0.3
info:
  title: OpenCode Server Capabilities API
  version: 1.0.0
  description: API for discovering available AI providers and models from OpenCode server

servers:
  - url: {baseUrl}
    description: Configurable OpenCode server instance

paths:
  /v1/capabilities:
    get:
      summary: Get server capabilities
      description: Retrieve available providers and their models
      operationId: getCapabilities
      responses:
        '200':
          description: Successful response with providers and models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    CapabilitiesResponse:
      type: object
      required:
        - providers
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
          description: List of available providers
          maxItems: 10
      example:
        providers:
          - id: "anthropic"
            name: "Anthropic"
            models:
              - id: "claude-3-5-sonnet-20241022"
                name: "Claude 3.5 Sonnet"

    Provider:
      type: object
      required:
        - id
        - name
        - models
      properties:
        id:
          type: string
          description: Unique provider identifier
          example: "anthropic"
        name:
          type: string
          description: Human-readable provider name
          example: "Anthropic"
        models:
          type: array
          items:
            $ref: '#/components/schemas/Model'
          description: Models available from this provider
          maxItems: 50

    Model:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Unique model identifier within provider
          example: "claude-3-5-sonnet-20241022"
        name:
          type: string
          description: Human-readable model name
          example: "Claude 3.5 Sonnet"

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message
          example: "Failed to retrieve models"